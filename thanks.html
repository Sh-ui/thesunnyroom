<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Check your inbox -- The Sunny Room</title>
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="hero">
  <div class="wrap">
    <svg class="art" viewBox="0 0 600 600" role="img" aria-label="Sunshine">
      <circle cx="300" cy="300" r="252" fill="rgba(238,140,34,.16)"/>
      <g transform="translate(300,300)" fill="rgba(201,138,43,.45)">
        <g id="r"><path d="M -16 -196 L 16 -196 L 6 -262 L -6 -262 Z"/></g>
        <use href="#r" transform="rotate(30)"/><use href="#r" transform="rotate(60)"/>
        <use href="#r" transform="rotate(90)"/><use href="#r" transform="rotate(120)"/>
        <use href="#r" transform="rotate(150)"/><use href="#r" transform="rotate(180)"/>
        <use href="#r" transform="rotate(210)"/><use href="#r" transform="rotate(240)"/>
        <use href="#r" transform="rotate(270)"/><use href="#r" transform="rotate(300)"/>
        <use href="#r" transform="rotate(330)"/>
      </g>
      <circle cx="300" cy="300" r="168" fill="url(#core)"/>
      <defs>
        <radialGradient id="core" cx="34%" cy="28%">
          <stop offset="0%" stop-color="#F7B45C"/>
          <stop offset="52%" stop-color="#EE8C22"/>
          <stop offset="100%" stop-color="#C2603E"/>
        </radialGradient>
      </defs>
    </svg>
    <div class="eyebrow">ONE MORE STEP</div>
    <h1>Check your inbox</h1>
    <p class="sub">The <span class="sunny-word" style="font-size:.95em">Sunny</span> Room Planner is on
    its way from <b>hello@thesunnyroom.co</b>. If it isn't there in a few minutes, peek at spam and
    drag it home.</p>
    <div class="cta-again" style="margin-top:26px">
      <button class="cta" onclick="location.href='https://www.pinterest.com/thesunnyroom/'">Browse the boards meanwhile</button>
    </div>
  </div>
</header>

<footer>
  <div class="wrap">
    The Sunny Room &middot; thesunnyroom.co &middot; <a href="https://www.pinterest.com/thesunnyroom/">Pinterest</a>
  </div>
</footer>

</body>
</html>
